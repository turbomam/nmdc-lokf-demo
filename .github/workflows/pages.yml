name: pages

# Builds the Astro site (which renders the knowledge/ bundle) and publishes it
# to GitHub Pages. In the repo's Settings -> Pages, set Source to
# "GitHub Actions". `npm ci` installs exactly what package-lock.json pins, and
# fails loudly if the lockfile and package.json disagree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.0.1
      - run: npm ci
      - run: npm run build
      # Before the artifact is uploaded, not in a parallel workflow. check.yml's
      # site-prose job runs on pull requests, but this workflow deploys on every
      # push to main independently of it, so a failing check there would not have
      # stopped a deploy here. Gating the upload is what makes the check mean
      # something.
      - name: Typography in the published prose
        run: uvx --from 'rust-just==1.58.0' just lint-dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
