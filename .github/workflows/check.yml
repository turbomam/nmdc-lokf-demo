name: check

# Three things that can silently rot:
#   1. the bundle stops validating against the LOKF schema
#   2. the committed knowledge.ttl drifts from the concepts it was generated from
#   3. banned typography reaches the published site, where nothing else looks
# All three are cheap to check and none is caught by the pages build.
#
# This runs `just check` rather than repeating its commands. An earlier version
# inlined them, which meant the version pins in the justfile did not apply here:
# CI resolved whatever lokf release was newest, so a new release could fail
# Actions or generate different Turtle while the documented local check passed.
# One definition, one set of pins, no way for local and CI to diverge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only needs to read the repo. The pages workflow scopes its token explicitly;
# do the same here rather than inheriting the default.
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5

      # just is on PyPI as rust-just, so uv supplies it and it gets pinned the
      # same way everything else here does. No extra action to trust.
      - name: Validate the bundle and check knowledge.ttl is current
        run: uvx --from 'rust-just==1.58.0' just check

  site-prose:
    # The em dash that shipped in the footer of all 8 pages was invisible to
    # every check this repository had, because they all look at the bundle or at
    # pull request bodies. This one looks at what a reader sees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      # Runs `just lint-site`, which builds the site and then lints it, rather
      # than repeating those two commands here. Same reason the bundle job runs
      # `just check`: one definition, so the recipe and CI cannot drift.
      - name: Typography in the published prose
        run: uvx --from 'rust-just==1.58.0' just lint-site
